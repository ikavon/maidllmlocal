# FG6 反编译/重混淆 MC 需要大内存（对齐官方 MDK）
# -Duser.language: 让 javac 诊断输出英文（Windows 控制台 GBK 下中文错误全是乱码）
org.gradle.jvmargs=-Xmx3G -Duser.language=en -Duser.country=US
org.gradle.daemon=false
# ⚠️ 本分支（ForgeGradle 6）与 configuration-cache / parallel 不兼容——
# main 分支的 ModDevGradle 开着它们，往这边 cherry-pick 时别把 gradle.properties 一起带过来。

## Environment Properties
# 对齐 AFoP 整合包实测运行时（其 logs/latest.log 启动参数）：
#   --fml.forgeVersion 47.4.16  --fml.mcVersion 1.20.1  Java 17（Azul Zulu 17.0.16）
# 用高于运行时的 Forge 版本编译可能引用到对方没有的 API（main 分支同理，见其注释）。
minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.21)
forge_version=47.4.16
# 下界 47.4：代码用了 ResourceLocation.fromNamespaceAndPath（47.4.x 反向移植，老 47.x 没有）
forge_version_range=[47.4,)
loader_version_range=[47,)
# Forge 1.20.1 运行时是 SRG 名（不是 mojmap），构建期由 reobfJar + mixin refmap 桥接。
# 主分支用 parchment 只是为了 IDE 参数名提示，编译产物无差别，这边先用 official 减少一个插件依赖。
mapping_channel=official
mapping_version=1.20.1

## Mod Properties

# The unique mod identifier for the mod. Must be lowercase in English locale. Must fit the regex [a-z][a-z0-9_]{1,63}
# Must match the String constant located in the main mod class annotated with @Mod.
mod_id=maidllmlocal
# The human-readable display name for the mod.
mod_name=MaidLLMLocal
# The license of your mod.
mod_license=MIT
# The mod version. See https://semver.org/
# 分支版本号约定：<对应主线版本>-forge.N（N 从 0 起，分支内递增；双向 cherry-pick 时据此对齐）。
# 0.6.1-forge.0 = main v0.6.1（情绪→轮盘动画临时关闭）的 Forge 1.20.1 移植首版。
# 0.7.0-forge.0 = main v0.7.0（-1 改纯对话、长期记忆归托管模式）的移植。
mod_version=0.7.0-forge.0
# The group ID for the mod.
# This should match the base package used for the mod sources.
# See https://maven.apache.org/guides/mini/guide-naming-conventions.html
mod_group_id=com.maidllmlocal
# The authors of the mod, displayed in the mod UI.
mod_authors=ikavon
# The description of the mod (multi line, \n works).
mod_description=Routes TLM LLM chat requests to the maid owner's own client, which sends them with the player's local config (per-player keys/endpoints).\nAlso relays MAICA role-play rounds and MTTS speech synthesis to the owner's client.\nRequires Touhou Little Maid. Server and owner client both need this mod.
