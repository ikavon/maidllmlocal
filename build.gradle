// forge-1.20 分支：ForgeGradle 6 构建（main 分支是 ModDevGradle/NeoForge，两边结构刻意保持镜像，便于 cherry-pick）。
// 基线 = Forge 官方 47.4.16 MDK，另加三处本 mod 特有：mixin AP（Forge 运行时是 SRG，refmap 必需）、
// MixinExtras jar-in-jar（NeoForge 自带、Forge 不带，而 LLMSiteEditorScreenMixin 用了 @WrapOperation）、
// TLM compileOnly + fg.deobf 运行期依赖。
plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7.38'
    id 'idea'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// Mojang ships Java 17 to end users in 1.18+, so mods should target Java 17.
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: mapping_channel, version: mapping_version

    // REQUIRED for the templates-based mods.toml flow to land in run configs.
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }
    }
}

// Forge 运行时用 SRG 名：mixin AP 生成 refmap（生产环境靠它把 mojmap 目标翻回 SRG），
// reobfJar 把整个 jar 的 MC 成员引用重混淆（下面 jar 任务 finalizedBy 触发）。
mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

sourceSets.main.resources {
    // Exclude development-only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files
}

repositories {
    mavenCentral() // MixinExtras
    // fg.deobf 不吃 files() 依赖（会警告并按混淆原样用，runClient 必炸），TLM 运行期走 flatDir 坐标
    flatDir { dir 'libs' }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // mixin 注解处理器（生成 refmap）
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    // TLM(车万女仆)：编译期引用其类；生产环境真正的 TLM jar 在整合包 mods/ 里，不随本 mod 打包。
    // 开发环境 runClient 需要 fg.deobf 把 SRG 生产 jar 反混淆回 mojmap 才能用。
    // 注意：libs/ 里这份文件名把原版的 "+" 换成了 "_"（flatDir 坐标解析友好），来源仍是
    // AFoP 整合包 mods/touhoulittlemaid-1.5.3-forge+mc1.20.1.jar 原样拷贝。
    compileOnly files("libs/touhoulittlemaid-1.5.3-forge_mc1.20.1.jar")
    runtimeOnly fg.deobf("blank:touhoulittlemaid:1.5.3-forge_mc1.20.1")

    // MixinExtras：NeoForge 自带，Forge 1.20.1 不带 → 必须 JiJ 随包分发。
    // 0.4.1 = 1.20.1 Forge 生态的通行版本（TLM 同期附属都用它，运行时 FML 取所有 JiJ 中最高版）。
    compileOnly 'io.github.llamalad7:mixinextras-common:0.4.1'
    annotationProcessor 'io.github.llamalad7:mixinextras-common:0.4.1'
    // FG6 的 JiJ 写法：jarJar(...) 返回依赖对象，ranged 声明兼容区间 [0.4.1,)——
    // 运行时若整合包里别的 mod 带了更高版 MixinExtras（如 AFoP 的 EMF 带 0.5.3），
    // FML 取最高版并跳过我们这份；区间比严格 pin 对生态友好。
    implementation(jarJar(group: 'io.github.llamalad7', name: 'mixinextras-forge', version: '0.4.1')) {
        jarJar.ranged(it, '[0.4.1,)')
    }
}

// FG6 的 Jar-in-Jar 是 opt-in：不调 enable()，jarJar 任务的 onlyIf 恒 false，
// 主 jar 里不会有任何 META-INF/jarjar 内容（第一次打包就在这里翻过车）。
jarJar.enable()

// This block of code expands all declared replace properties in the specified resource targets.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }

    // This is the preferred method to reobfuscate your jar file (SRG for Forge 1.20.1 runtime)
    finalizedBy 'reobfJar'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
